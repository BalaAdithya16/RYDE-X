<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RYDEX — Confirmed</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --gold:  #c9a84c;
      --gold2: #e8c97a;
      --ink:   #0c0c0e;
      --ink2:  #141418;
      --muted: rgba(245,240,232,0.38);
      --border: rgba(201,168,76,0.18);
    }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    /* ── Cinematic noise grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 160px;
    }

    /* ── Ambient light ── */
    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 55% 45% at 50% -10%, rgba(201,168,76,0.09) 0%, transparent 65%),
        radial-gradient(ellipse 30% 40% at 100% 100%, rgba(201,168,76,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 0% 60%,   rgba(201,168,76,0.03) 0%, transparent 55%);
    }

    /* ── Diagonal rule lines ── */
    .rules {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden; opacity: 0.04;
    }
    .rules::before, .rules::after {
      content: '';
      position: absolute;
      width: 1px; height: 200%;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      top: -50%;
    }
    .rules::before { left: 20%; transform: rotate(15deg); }
    .rules::after  { right: 20%; transform: rotate(-15deg); }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 60px 24px;
    }

    .inner {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Monogram ring ── */
    .ring-wrap {
      position: relative;
      width: 110px; height: 110px;
      margin-bottom: 40px;
      animation: ringIn 1s cubic-bezier(.16,1,.3,1) both;
    }
    .ring-svg {
      position: absolute; inset: 0;
      animation: spinSlow 18s linear infinite;
    }
    .ring-center {
      position: absolute; inset: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 300;
      color: var(--gold2);
      letter-spacing: 2px;
    }
    @keyframes ringIn {
      from { opacity: 0; transform: scale(0.6) rotate(-90deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    /* ── Label ── */
    .eyebrow {
      font-size: 9px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
      animation: fadeUp .6s ease both .2s;
    }

    /* ── Hero text ── */
    .hero-word {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(68px, 16vw, 110px);
      line-height: 0.88;
      letter-spacing: -1px;
      color: var(--cream);
      display: block;
      animation: revealWord .9s cubic-bezier(.16,1,.3,1) both;
      overflow: hidden;
    }
    .hero-word span {
      display: block;
      animation: slideUp .9s cubic-bezier(.16,1,.3,1) both .1s;
    }
    @keyframes revealWord {
      from { clip-path: inset(0 0 100% 0); }
      to   { clip-path: inset(0 0 0% 0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .hero-accent {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(68px, 16vw, 110px);
      line-height: 0.88;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      overflow: hidden;
      animation: revealWord .9s cubic-bezier(.16,1,.3,1) both .15s;
    }
    .hero-accent span {
      display: block;
      animation: slideUp .9s cubic-bezier(.16,1,.3,1) both .25s;
    }

    /* ── Divider ── */
    .divider {
      width: 100%; max-width: 340px;
      display: flex; align-items: center; gap: 16px;
      margin: 32px 0;
      animation: fadeUp .6s ease both .4s;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-diamond {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── ID plate ── */
    .id-plate {
      background: rgba(201,168,76,0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 22px 44px;
      margin-bottom: 12px;
      animation: fadeUp .6s ease both .5s;
      position: relative;
      overflow: hidden;
    }
    .id-plate::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 60%);
    }
    .id-label {
      font-size: 9px; font-weight: 700; letter-spacing: 4px;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 10px; display: block;
    }
    .id-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px; font-weight: 600;
      letter-spacing: 4px; line-height: 1;
      color: var(--cream);
      display: block;
    }

    /* ── Subtext ── */
    .confirm-sub {
      font-size: 12px; font-weight: 400;
      color: var(--muted); letter-spacing: 1px;
      line-height: 1.9; max-width: 340px;
      animation: fadeUp .6s ease both .6s;
    }

    /* ── Route pill ── */
    .route-pill {
      display: flex; align-items: center; gap: 0;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      padding: 10px 20px;
      margin: 28px 0;
      max-width: 400px; width: 100%;
      animation: fadeUp .6s ease both .65s;
      overflow: hidden;
    }
    .route-from, .route-to {
      font-size: 12px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--cream); flex: 1; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .route-arrow {
      flex-shrink: 0; width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--ink); margin: 0 10px;
    }

    /* ── Status row ── */
    .status-row {
      display: flex; gap: 12px; margin-bottom: 36px;
      animation: fadeUp .6s ease both .7s;
    }
    .status-chip {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted);
    }
    .status-chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; width: 100%; max-width: 380px;
      animation: fadeUp .6s ease both .8s;
    }
    .btn {
      flex: 1; font-family: 'Montserrat', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      padding: 16px 12px; border-radius: 3px;
      border: none; cursor: pointer;
      transition: all .25s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--ink);
      box-shadow: 0 4px 24px rgba(201,168,76,0.28);
    }
    .btn-gold:hover { box-shadow: 0 8px 36px rgba(201,168,76,0.45); transform: translateY(-2px); }
    .btn-ghost {
      background: transparent; color: var(--cream);
      border: 1px solid rgba(245,240,232,0.15);
    }
    .btn-ghost:hover { background: rgba(245,240,232,0.05); border-color: rgba(245,240,232,0.35); transform: translateY(-2px); }

    /* ── Footer mark ── */
    .foot-mark {
      margin-top: 48px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; letter-spacing: 6px;
      text-transform: uppercase; color: rgba(201,168,76,0.25);
      animation: fadeUp .6s ease both .9s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="ambient"></div>
<div class="rules"></div>

<div class="page">
  <div class="inner">

    <!-- Spinning monogram ring -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="55" cy="55" r="52" stroke="url(#ringGrad)" stroke-width="0.8" stroke-dasharray="4 6"/>
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="110" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#e8c97a" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.7"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="ring-center">✓</div>
    </div>

    <p class="eyebrow">Rydex Premium · Booking Confirmed</p>

     <div class="hero-word"><span>Your ride awaits.</span></div>
    <!-- <div class="hero-word"><span>awaits.</span></div> -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <div class="id-plate">
      <span class="id-label">Booking Reference</span>
      <span class="id-value" id="rideIdDisplay">#——</span>
    </div>

    <p class="confirm-sub" id="confirmSub">
      Your booking has been confirmed and a driver has been assigned.
    </p>

    <div class="route-pill" id="routePill" style="display:none">
      <span class="route-from" id="routeFrom">—</span>
      <div class="route-arrow">→</div>
      <span class="route-to" id="routeTo">—</span>
    </div>

    <div class="status-row">
      <div class="status-chip"><div class="dot"></div> Active</div>
      <div class="status-chip" id="etaChip">— min ETA</div>
      <div class="status-chip" id="fareChip">₹ —</div>
    </div>

    <div class="btn-row">
      <button class="btn btn-gold" onclick="location.href='/'">Book Again</button>
      <button class="btn btn-ghost" onclick="location.href='/?track=1'">Track Ride</button>
    </div>

    <div class="foot-mark">RYDEX</div>
  </div>
</div>
<script src='https://cdn.jsdelivr.net/npm/kore-web-sdk@11.23.0/dist/umd/kore-web-sdk-umd-chat.min.js'></script> 
<script> KoreChatSDK.chatConfig.botOptions.API_KEY_CONFIG.KEY = '9dbfe9fb7420460da45d79526074ee9bf0494f796482468cb93dd3df307898d1stbc'; 
  new KoreChatSDK.chatWindow().show(KoreChatSDK.chatConfig); 
</script> 
<script>
  const raw  = sessionStorage.getItem('rydex_confirmed');
  const ride = raw ? JSON.parse(raw) : null;

  if (ride) {
    // Ride ID
    document.getElementById('rideIdDisplay').textContent = '#' + (ride.ride_id || ride.id);

    // Route
    if (ride.customer) {
      const pill = document.getElementById('routePill');
      pill.style.display = 'flex';
      document.getElementById('routeFrom').textContent = ride.customer.pickup_location || '—';
      document.getElementById('routeTo').textContent   = ride.customer.drop_location   || '—';
    }

    // ETA & fare chips
    if (ride.eta_mins) document.getElementById('etaChip').textContent = ride.eta_mins + ' min ETA';
    if (ride.cost)     document.getElementById('fareChip').textContent = '₹ ' + ride.cost;
  }
</script>
</body>
</html>
